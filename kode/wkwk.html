<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himpunan Badminton Informatika</title>

<style>
:root{
    --primary:#142638;
    --accent:#a8e66c;
    --bg:#f4f7f5;
    --text:#1d2939;
    --muted:#667085;
    --white:#ffffff;
    --border:#e7ece9;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.button{
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    background:var(--accent);
    color:var(--primary);
    font-weight:700;
    transition:.2s ease;
}

.button:hover{
    transform:translateY(-2px);
}

.message-card{
    max-width:700px;
    width:100%;
    background:var(--white);

    border:1px solid var(--border);

    border-radius:16px;
    padding:40px;

    text-align:center;

    box-shadow: 0 0px 30px var(--primary);
}

.message-card h1{
    color:var(--primary);
    margin-bottom:20px;
    font-size:2rem;
}

.message-card p{
    color:var(--muted);
    font-size:1.2rem;
    line-height:1.8;
}
</style>
</head>
<body>

<div class="message-card">
    <h1>🏸 Himpunan Badminton Informatika</h1>

    <p>
        fitur in belum berfungsi T_T
    </p>
    <a href="index.html" class="button">Kembali</a>

</div>

</body>
